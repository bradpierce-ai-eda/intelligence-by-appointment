<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Complexity must earn its keep</title>
  <desc id="desc">Five deployable architectures face the same compound event under one accounting perimeter, followed by predicted win and loss regimes for appointment machinery.</desc>
  <defs>
    <style>.title{font:700 43px Arial,sans-serif;fill:#172434}.sub{font:400 23px Arial,sans-serif;fill:#546579}.tag{font:700 18px Arial,sans-serif;fill:#2F6FA3;letter-spacing:1px}.head{font:700 22px Arial,sans-serif;fill:#172434}.regime{font:700 18px Arial,sans-serif;fill:#172434}.body{font:400 18px Arial,sans-serif;fill:#33475B}.small{font:400 15px Arial,sans-serif;fill:#546579}.regimebody{font:400 14px Arial,sans-serif;fill:#546579}.label{font:700 14px Arial,sans-serif;fill:#2F6FA3;letter-spacing:.45px}.panel{fill:#F8FAFC;stroke:#CDD6E0;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="90" y="80" class="tag">Q4 · VALUE AND FAILURE</text><text x="90" y="135" class="title">Complexity must earn its keep</text>
  <text x="90" y="178" class="sub">Executability is not evidence of value. The unified object must improve decision value under matched constraints.</text>

  <g transform="translate(90,225)">
    <rect class="panel" x="0" y="0" width="990" height="500" rx="24"/>
    <text x="30" y="45" class="label">PANEL A · SAME EPISODE, ONE ACCOUNTING PERIMETER</text>
    <rect x="28" y="72" width="934" height="56" rx="14" fill="#172434"/>
    <text x="495" y="107" text-anchor="middle" class="body" style="fill:#fff">anomaly 1 remains active when unrelated event 2 arrives</text>
    <g transform="translate(28,155)">
      <rect x="0" y="0" width="170" height="195" rx="18" fill="#F8FAFC" stroke="#CDD6E0" stroke-width="2"/>
      <text x="85" y="37" text-anchor="middle" class="head">Uniform rich</text><text x="85" y="75" text-anchor="middle" class="small">coverage: high</text><text x="85" y="105" text-anchor="middle" class="small">continuous cost: high</text><text x="85" y="135" text-anchor="middle" class="small">explicit exit: no</text><text x="85" y="165" text-anchor="middle" class="small">reserve: inherent</text>
      <rect x="191" y="0" width="170" height="195" rx="18" fill="#F8FAFC" stroke="#CDD6E0" stroke-width="2"/>
      <text x="276" y="30" text-anchor="middle" class="head">Conditional</text><text x="276" y="56" text-anchor="middle" class="head">computation</text><text x="276" y="95" text-anchor="middle" class="small">activation: selective</text><text x="276" y="125" text-anchor="middle" class="small">reserve: implicit</text><text x="276" y="155" text-anchor="middle" class="small">authority: external</text>
      <rect x="382" y="0" width="170" height="195" rx="18" fill="#F8FAFC" stroke="#CDD6E0" stroke-width="2"/>
      <text x="467" y="30" text-anchor="middle" class="head">Self-adaptive</text><text x="467" y="56" text-anchor="middle" class="head">orchestration</text><text x="467" y="95" text-anchor="middle" class="small">placement: flexible</text><text x="467" y="125" text-anchor="middle" class="small">policy: local</text><text x="467" y="155" text-anchor="middle" class="small">exit: variable</text>
      <rect x="573" y="0" width="170" height="195" rx="18" fill="#F8FAFC" stroke="#CDD6E0" stroke-width="2"/>
      <text x="658" y="30" text-anchor="middle" class="head">Composed</text><text x="658" y="56" text-anchor="middle" class="head">mechanisms</text><text x="658" y="95" text-anchor="middle" class="small">matched mechanisms</text><text x="658" y="125" text-anchor="middle" class="small">separate contracts</text><text x="658" y="155" text-anchor="middle" class="small">fragmented lifecycle</text>
      <rect x="764" y="0" width="170" height="195" rx="18" fill="#F0F7FA" stroke="#2F6FA3" stroke-width="3"/>
      <text x="849" y="30" text-anchor="middle" class="head">Appointment</text><text x="849" y="56" text-anchor="middle" class="head">governed</text><text x="849" y="95" text-anchor="middle" class="small">one typed grant</text><text x="849" y="125" text-anchor="middle" class="small">reserve explicit</text><text x="849" y="155" text-anchor="middle" class="small">exit enforced</text>
    </g>
    <rect x="28" y="382" width="934" height="86" rx="16" fill="#F4F7FA"/>
    <text x="495" y="414" text-anchor="middle" class="label">COUNT EVERYTHING</text>
    <text x="495" y="445" text-anchor="middle" class="small">energy · latency · bytes · memory traffic · state movement · safety machinery · human help</text>

    <rect class="panel" x="1020" y="0" width="400" height="500" rx="24"/>
    <text x="1050" y="45" class="label">PANEL B · PREDICTED REGIMES</text>
    <g transform="translate(1050,78)">
      <rect x="0" y="0" width="340" height="174" rx="18" fill="#E6F3EF" stroke="#2A8C82" stroke-width="2"/>
      <text x="20" y="38" class="regime">Appointment may win when</text>
      <text x="20" y="74" class="regimebody">• rich demand is sparse and localized</text><text x="20" y="105" class="regimebody">• compound events make reserve valuable</text><text x="20" y="136" class="regimebody">• state, deadlines, and authority matter</text>
      <rect x="0" y="198" width="340" height="210" rx="18" fill="#FCECEC" stroke="#C64B4B" stroke-width="2"/>
      <text x="20" y="236" class="regime">Appointment should lose when</text>
      <text x="20" y="272" class="regimebody">• rich demand is nearly continuous</text><text x="20" y="303" class="regimebody">• triggers are weak or wake-up is slow</text><text x="20" y="334" class="regimebody">• movement or cleanup dominates</text><text x="20" y="365" class="regimebody">• composed mechanisms match outcomes</text>
    </g>
  </g>

  <g transform="translate(90,760)">
    <rect x="0" y="0" width="1420" height="82" rx="18" fill="#FFF4DD" stroke="#D99A2B" stroke-width="2"/>
    <text x="710" y="34" text-anchor="middle" class="head">Controls stay visible, but subordinate</text>
    <text x="710" y="63" text-anchor="middle" class="small">uniform-simple · static-heterogeneous · trigger oracle · placement oracle</text>
  </g>
</svg>
